<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="ui-monospace, monospace" font-size="10.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="240" fill="#f5f5f2"/>
  <g>
    <rect x="16" y="60" width="160" height="90" fill="#fff" stroke="#000"/>
    <text x="96" y="88" text-anchor="middle" font-size="11">office building</text>
    <text x="96" y="108" text-anchor="middle" fill="#666" font-size="9">CityGML massing</text>
    <text x="96" y="121" text-anchor="middle" fill="#666" font-size="9">MapPLUTO floor areas</text>
    <text x="96" y="134" text-anchor="middle" fill="#666" font-size="9">depth, height, area, age</text>
  </g>
  <line x1="176" y1="105" x2="206" y2="105" stroke="#000"/>
  <g>
    <rect x="206" y="50" width="180" height="110" fill="#fff" stroke="#000"/>
    <text x="296" y="74" text-anchor="middle" font-size="11">gate 1: shape</text>
    <text x="296" y="94" text-anchor="middle" fill="#666" font-size="9">weighted sum of 4 proxies</text>
    <text x="296" y="107" text-anchor="middle" fill="#666" font-size="9">score &#8805; threshold?</text>
    <text x="296" y="128" text-anchor="middle" fill="#666" font-size="9">our score, our weights;</text>
    <text x="296" y="141" text-anchor="middle" fill="#666" font-size="9">3 published criteria unmeasured</text>
  </g>
  <line x1="386" y1="105" x2="416" y2="105" stroke="#000"/>
  <g>
    <rect x="416" y="50" width="200" height="110" fill="#fff" stroke="#000"/>
    <text x="516" y="74" text-anchor="middle" font-size="11">gate 2: the deal</text>
    <text x="516" y="94" text-anchor="middle" fill="#666" font-size="9">residential value - conversion cost</text>
    <text x="516" y="107" text-anchor="middle" fill="#666" font-size="9">&gt; office value?</text>
    <text x="516" y="128" text-anchor="middle" fill="#666" font-size="9">values = rent / cap rate</text>
    <text x="516" y="141" text-anchor="middle" fill="#666" font-size="9">+ 467-m eligibility tests, if on</text>
  </g>
  <line x1="616" y1="105" x2="646" y2="105" stroke="#000"/>
  <g>
    <rect x="646" y="65" width="98" height="80" fill="#000"/>
