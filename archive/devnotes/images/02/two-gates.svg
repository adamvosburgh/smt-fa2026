    <text x="695" y="128" text-anchor="middle" fill="#ccc" font-size="9">6 dates it clears</text>
  </g>
  <text x="16" y="190" fill="#000">office rent: $54/sf asking (Comptroller, May 2024), drifting each year by the trend control</text>
  <text x="16" y="206" fill="#444">residential rent, conversion cost, cap rates, operating share: assumptions, all sliders</text>
  <text x="16" y="222" fill="#444">conversion cost scales with how badly a building scores, so the two gates are linked</text>
