<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="ui-monospace, monospace" font-size="10.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="330" fill="#f5f5f2"/>
  <text x="16" y="24" font-size="11" fill="#000">Anthromes 2.1 cascade, first match wins. Inputs per cell: population density, land-use fractions.</text>
  <text x="16" y="52" fill="#444">population density band</text>
  <text x="240" y="52" fill="#444">then land use decides the class</text>
  <line x1="16" y1="58" x2="744" y2="58" stroke="#000" stroke-width="0.8"/>
  <text x="16" y="82">&#8805; 2,500 /km&#178;, or built-up &#8805; 20%</text>
  <text x="240" y="82">Urban</text>
  <text x="16" y="108">&#8805; 100 /km&#178;</text>
  <text x="240" y="108">Mixed settlements, or a village by its dominant use:</text>
  <text x="240" y="122" fill="#444">rice &#8805; 20% Rice · irrigated &#8805; 20% Irrigated · crops &#8805; 20% Rainfed · else Pastoral</text>
  <text x="16" y="150">&#8805; 10 /km&#178;</text>
  <text x="240" y="150">Residential: irrigated croplands, rainfed croplands, rangelands, woodlands</text>
  <text x="16" y="178">&#8805; 1 /km&#178;</text>
  <text x="240" y="178">Populated: croplands, rangelands, woodlands</text>
  <text x="16" y="206">&#8805; 0.0001 /km&#178;</text>
  <text x="240" y="206">Remote: croplands, rangelands, woodlands; Inhabited drylands</text>
  <text x="16" y="234">below that</text>
  <text x="240" y="234">Wild woodlands / Wild drylands / Ice</text>
  <line x1="16" y1="248" x2="744" y2="248" stroke="#000" stroke-width="0.8"/>
  <text x="16" y="272" fill="#444">"used" = crops + grazing + built-up &#8805; 20%. Croplands need crops &#8805; 20%; rangelands need grazing &#8805; 20%.</text>
  <text x="16" y="288" fill="#444">Woodland vs dryland comes from the potential vegetation map (classes 1-8 count as forested).</text>
  <text x="16" y="312" fill="#000">Every number above is a slider in the sandbox. Defaults are the published values.</text>
</svg>
