<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="ui-monospace, monospace" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="300" fill="#f5f5f2"/>
  <!-- lot -->
  <rect x="60" y="30" width="200" height="240" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="160" y="290" text-anchor="middle" fill="#000">street</text>
  <line x1="60" y1="270" x2="260" y2="270" stroke="#000" stroke-width="3"/>
  <!-- house -->
  <rect x="85" y="150" width="150" height="110" fill="#ddd" stroke="#000" stroke-width="1"/>
  <text x="160" y="210" text-anchor="middle">house</text>
  <!-- required rear yard -->
  <rect x="60" y="30" width="200" height="60" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="270" y="50" fill="#444">required rear yard</text>
  <text x="270" y="64" fill="#444">depth from ZR 23-342:</text>
  <text x="270" y="78" fill="#444">20 ft detached, 30 ft semi-detached on a narrow lot</text>
  <!-- unit: one third of required rear yard area, 5ft setbacks -->
  <rect x="120" y="38" width="80" height="44" fill="#000"/>
  <text x="270" y="110" fill="#000">unit: at most 1/3 of the required rear yard's area</text>
  <text x="270" y="124" fill="#000">(ZR 23-341(b)(4)), capped at 800 sf (ZR 12-10),</text>
  <text x="270" y="138" fill="#000">one storey, 15 ft; nothing below 300 sf is habitable</text>
  <line x1="60" y1="38" x2="120" y2="38" stroke="#888" stroke-width="0.8"/>
  <line x1="200" y1="38" x2="260" y2="38" stroke="#888" stroke-width="0.8"/>
  <text x="270" y="170" fill="#444">5 ft setback from rear and side lot lines</text>
  <line x1="60" y1="86" x2="120" y2="86" stroke="#888" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="270" y="200" fill="#444">Open ground behind the house is measured from the</text>
  <text x="270" y="214" fill="#444">lot outline and the building footprint; the unit is</text>
  <text x="270" y="228" fill="#444">drawn there at the plan library's proportions (0.70).</text>
  <text x="270" y="256" fill="#444">The street edge is the lot edge no other lot in the</text>
  <text x="270" y="270" fill="#444">tax block shares; the back is opposite.</text>
</svg>
