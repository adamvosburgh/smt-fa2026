<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1200" height="300" fill="#fff"/>
  <g stroke="#000" fill="#fafaf8">
    <rect x="30" y="60" width="200" height="120"/>
    <rect x="330" y="60" width="200" height="120"/>
    <rect x="630" y="60" width="200" height="120"/>
    <rect x="930" y="60" width="240" height="120"/>
  </g>
  <g font-weight="bold">
    <text x="130" y="88" text-anchor="middle">notebook</text>
    <text x="430" y="88" text-anchor="middle">brief.md</text>
    <text x="730" y="88" text-anchor="middle">build.md</text>
    <text x="1050" y="88" text-anchor="middle">index.html</text>
  </g>
  <g fill="#555" font-size="11">
    <text x="130" y="108" text-anchor="middle">Tutorials 2 and 3</text>
    <text x="130" y="124" text-anchor="middle">the rule, working, with numbers</text>
    <text x="130" y="140" text-anchor="middle">+ data.json exported from it</text>
    <text x="430" y="108" text-anchor="middle">what it shows, the data,</text>
    <text x="430" y="124" text-anchor="middle">the rule, every control and</text>
    <text x="430" y="140" text-anchor="middle">whose number it is, the clock</text>
    <text x="730" y="108" text-anchor="middle">file layout, data contract,</text>
    <text x="730" y="124" text-anchor="middle">controls table, pseudocode,</text>
    <text x="730" y="140" text-anchor="middle">acceptance checks</text>
    <text x="1050" y="108" text-anchor="middle">one self-contained file,</text>
    <text x="1050" y="124" text-anchor="middle">data inline, no network,</text>
    <text x="1050" y="140" text-anchor="middle">under 15MB</text>
  </g>
  <g stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="230" y1="120" x2="328" y2="120"/>
    <line x1="530" y1="120" x2="628" y2="120"/>
    <line x1="830" y1="120" x2="928" y2="120"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs>
  <g font-size="12">
    <text x="280" y="105" text-anchor="middle" font-weight="bold">you</text>
    <text x="280" y="150" text-anchor="middle" fill="#555">write</text>
    <text x="580" y="105" text-anchor="middle" font-weight="bold">an LLM</text>
    <text x="580" y="150" text-anchor="middle" fill="#555">plans; you read</text>
    <text x="880" y="105" text-anchor="middle" font-weight="bold">a coding agent</text>
    <text x="880" y="150" text-anchor="middle" fill="#555">builds; you check</text>
  </g>
  <g fill="#333" font-size="12">
    <text x="30" y="225">Two checks that are yours and nobody else's:</text>
    <text x="30" y="247">1.  Did the plan or the code invent a number? Every figure in index.html has to trace to brief.md, and every figure in brief.md to a source or to you.</text>
    <text x="30" y="269">2.  At the defaults, does index.html give the notebook's totals? If it doesn't, one of them is wrong, and you get to find out which.</text>
  </g>
</svg>
