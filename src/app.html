<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet" />
  <!-- Self-hosted Umami. `defer`, and no cookies, so it costs the reader
       nothing and blocks nothing.
       The enroll link carries the student's token as ?t=, and Umami records
       the full address on the first pageview and passes it on as the referrer
       of the next one. data-exclude-search does not cover the first pageview,
       so every payload goes through smtBeforeSend, which drops the query string
       and fragment from both. -->
  <script>
    window.smtBeforeSend = function (type, payload) {
      var strip = function (u) {
        try { var x = new URL(u); x.search = ''; x.hash = ''; return x.toString(); } catch (e) { return u; }
      };
      if (payload && payload.url) payload.url = strip(payload.url);
      if (payload && payload.referrer) payload.referrer = strip(payload.referrer);
      return payload;
    };
  </script>
  <script defer src="https://analytics.adamvosburgh.com/script.js" data-website-id="6b79ba04-424f-44dd-beab-349c433c5c7a" data-before-send="smtBeforeSend"></script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
